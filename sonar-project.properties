sonar.projectKey=lucas-soares-galvao_movie-data-pipeline-aws
sonar.organization=lucas-soares-galvao

sonar.sources=app,scripts
sonar.tests=test
# Versões reais do repo: jobs Glue PythonShell (glue_etl, glue_details) rodam em 3.9 e
# importam shared_utils; o resto (Lightsail/Streamlit, testes, CI) roda em 3.12. Declarar
# só 3.12 fazia o Sonar sugerir sintaxe PEP 695 (python:S6796), que é SyntaxError em 3.9.
sonar.python.version=3.9,3.12
sonar.python.coverage.reportPaths=coverage.xml

# Mockups de design do FilmBot (HTML/CSS/JS de referência visual e assets de fonte,
# em app/lightsail_ia/design/) não são código de produção do pipeline — ficam fora
# da análise para não poluir o relatório com regras Web:/css: (review de UX, não do
# código Python/SQL/infra que o Sonar foi configurado para cobrir).
sonar.exclusions=app/lightsail_ia/design/**

# JS estático do FilmBot (app/lightsail_ia/static/js/) não tem suíte de teste no
# projeto (só Python é medido via pytest --cov, ver coverage.xml) — sem isso, o Sonar
# conta esses arquivos como 0% cobertos e arrasta o coverage geral pra baixo sem
# refletir um gap real de teste. Exclusão só de coverage (não de sonar.exclusions):
# os arquivos continuam analisados normalmente quanto a bugs/code smells/duplications.
sonar.coverage.exclusions=app/lightsail_ia/static/js/**

# css:S9423 ("Remove this !important") fica desligada só para o CSS do FilmBot. O !important ali
# é intencional: o tema "Luminous" sobrepõe o CSS do Streamlit (emotion, injetado depois e com
# seletores de alta especificidade), e sem ele o visual quebra — o que o Sonar sugere
# (resolver o conflito de especificidade) não é viável sobre CSS de terceiros que não controlamos.
# Escopo mínimo: outras regras css: continuam valendo nesses arquivos (ex.: css:S9440).
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=css:S9423
sonar.issue.ignore.multicriteria.e1.resourceKey=app/lightsail_ia/static/css/**

