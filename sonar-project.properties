sonar.projectKey=lucas-soares-galvao_movie-data-pipeline-aws
sonar.organization=lucas-soares-galvao

sonar.sources=app,scripts
sonar.tests=test
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

# Mockups de design do FilmBot (HTML/CSS/JS de referência visual e assets de fonte,
# em app/lightsail_ia/design/) não são código de produção do pipeline — ficam fora
# da análise para não poluir o relatório com regras Web:/css: (review de UX, não do
# código Python/SQL/infra que o Sonar foi configurado para cobrir).
sonar.exclusions=app/lightsail_ia/design/**

# JS estático do FilmBot (app/lightsail_ia/static/js/) não tem suíte de teste no
# projeto (só Python é medido via pytest --cov, ver coverage.xml) — sem isso, o Sonar
# conta esses arquivos como 0% cobertos e arrasta o coverage geral pra baixo sem
# refletir um gap real de teste. Exclusão só de coverage (não de sonar.exclusions):
# os arquivos continuam analisados normalmente quanto a bugs/code smells/duplications.
sonar.coverage.exclusions=app/lightsail_ia/static/js/**

