name: 0. Pipeline CI/CD

# =============================================================================
# Pipeline principal — orquestra todos os workflows do projeto.
#
# Fluxo Git Flow implementado:
#
#   feature/* ──push──► Testes (pytest, ruff, mypy, bandit)
#                            │
#                            └──► Auto PR: feature/* → develop
#
#   develop   ──push──► Testes (pytest, ruff, mypy, bandit)
#                            │
#                            └──► Terraform (infra dev)
#                                     │
#                                     └──► Auto PR: develop → main
#
#   main      ──push──► Testes (pytest, ruff, mypy, bandit)
#                            │
#                            └──► Terraform (infra prod)
#                                     │
#                                     └──► Deploy Lightsail (app FilmBot)
#
#   main      ──push──► sonar (SonarQube Cloud, em paralelo ao Terraform —
#                        nenhum dos dois depende do outro)
#
# O job "test" roda nas 3 branches (feature/*, develop, main) desde que se
# descobriu que o gate de cobertura (--cov-fail-under=95) só rodava em
# feature/* — uma vez que o código chegava em develop/main (via PR automático
# do pr_auto.yml, que só valida sintaxe Terraform, nunca teste/cobertura),
# nada reexecutava o gate, e uma regressão de cobertura podia ficar parada em
# main sem que o pipeline acusasse.
#
# Em develop/main, "terraform" espera "test" passar (needs: test, ver
# comentário no job abaixo) — travando também "deploy-lightsail" e
# "auto-pr-environment" em cascata, já que os dois dependem de "terraform".
#
# Workflows reutilizáveis (chamados por este arquivo):
#   test.yml          — qualidade de código (testes, lint, cobertura)
#   terraform.yml     — provisionamento de infraestrutura AWS
#   pr_auto.yml       — criação automática de Pull Requests
#   deploy_lightsail.yml — deploy do app FilmBot na instância AWS
#   sonar.yml         — análise de qualidade de código via SonarQube Cloud
#
# O job "sonar" só é chamado em push:main (não em develop/feature/*) porque o
# plano Free do SonarQube Cloud só analisa de forma contínua a branch marcada
# como "principal" no projeto Sonar, que é "main" (ver sonar-project.properties).
# =============================================================================

on:
  push:
    branches: [feature/*, develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de deploy (dev, prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read
  actions: write
  pull-requests: write

jobs:

  # Resolve o ambiente (dev/prod) uma única vez para os jobs terraform e
  # deploy-lightsail, evitando repetir a mesma ternária nos dois:
  # - workflow_dispatch → usa o ambiente selecionado manualmente pelo usuário
  # - push em develop   → ambiente "dev"
  # - push em main      → ambiente "prod"
  # - push em feature/* → não há ambiente (environment="n/a"); o job roda aqui
  #   só para conectar "test" a este hub no grafo do Actions, igual ao
  #   "needs: resolve-env" organizacional do job "sonar" abaixo — "test" não
  #   consome outputs.environment
  resolve-env:
    if: |
      startsWith(github.ref_name, 'feature/') || github.ref_name == 'develop' || github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - name: Resolve environment
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            ENV="dev"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            ENV="prod"
          else
            ENV="n/a"
          fi
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "🌎 Ambiente resolvido: $ENV"

  test:
    needs: resolve-env
    if: |
      startsWith(github.ref_name, 'feature/') || github.ref_name == 'develop' || github.ref_name == 'main'
    uses: ./.github/workflows/test.yml

  auto-pr-feature:
    needs: test
    if: |
      startsWith(github.ref_name, 'feature/') &&
      needs.test.result == 'success'
    uses: ./.github/workflows/pr_auto.yml
    with:
      branch_name: ${{ github.ref_name }}
    permissions:
      contents: write
      pull-requests: write

  # needs: test — terraform.yml constrói e aplica na AWS o pacote da Lambda e
  # os wheels dos jobs Glue direto do app/ (build_lambda_package.py,
  # build_glue_wheel.py); sem esperar "test", uma regressão de teste/cobertura
  # podia ser aplicada em dev/prod antes (ou independente) do gate acusar.
  # "needs.test.result == 'skipped'" cobre o workflow_dispatch disparado a
  # partir de uma branch fora de feature/*|develop|main, onde "test" nem
  # chega a rodar (sua condição só olha ref_name) — nesse caso não há
  # resultado de teste para checar, então não bloqueia. Se o dispatch vier de
  # develop/main (o caso normal), "test" roda e precisa ter sucesso.
  terraform:
    needs: [resolve-env, test]
    if: |
      (github.ref_name == 'develop' || github.ref_name == 'main' || github.event_name == 'workflow_dispatch') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    uses: ./.github/workflows/terraform.yml
    with:
      environment: ${{ needs.resolve-env.outputs.environment }}
    secrets:
      # Secrets possuem sufixo _DEV ou _PROD. A expressão seleciona o correto
      # com base no mesmo critério do ambiente acima:
      # dispatch+dev → _DEV | dispatch+prod → _PROD | develop → _DEV | main → _PROD
      aws-assume-role-arn: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.environment == 'dev' && secrets.AWS_ASSUME_ROLE_ARN_DEV || secrets.AWS_ASSUME_ROLE_ARN_PROD) || github.ref_name == 'develop' && secrets.AWS_ASSUME_ROLE_ARN_DEV || secrets.AWS_ASSUME_ROLE_ARN_PROD }}
      aws-statefile-s3-bucket: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.environment == 'dev' && secrets.AWS_STATEFILE_S3_BUCKET_DEV || secrets.AWS_STATEFILE_S3_BUCKET_PROD) || github.ref_name == 'develop' && secrets.AWS_STATEFILE_S3_BUCKET_DEV || secrets.AWS_STATEFILE_S3_BUCKET_PROD }}
      aws-lock-dynamodb-table: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.environment == 'dev' && secrets.AWS_LOCK_DYNAMODB_TABLE_DEV || secrets.AWS_LOCK_DYNAMODB_TABLE_PROD) || github.ref_name == 'develop' && secrets.AWS_LOCK_DYNAMODB_TABLE_DEV || secrets.AWS_LOCK_DYNAMODB_TABLE_PROD }}
      aws-filmbot-secret-arn: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.environment == 'dev' && secrets.AWS_FILMBOT_SECRET_ARN_DEV || secrets.AWS_FILMBOT_SECRET_ARN_PROD) || github.ref_name == 'develop' && secrets.AWS_FILMBOT_SECRET_ARN_DEV || secrets.AWS_FILMBOT_SECRET_ARN_PROD }}
      aws-github-workflow-dispatch-token: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.environment == 'dev' && secrets.AWS_GH_WORKFLOW_DISPATCH_TOKEN_DEV || secrets.AWS_GH_WORKFLOW_DISPATCH_TOKEN_PROD) || github.ref_name == 'develop' && secrets.AWS_GH_WORKFLOW_DISPATCH_TOKEN_DEV || secrets.AWS_GH_WORKFLOW_DISPATCH_TOKEN_PROD }}
      notification-email: ${{ secrets.NOTIFICATION_EMAIL }}
      infracost-api-key: ${{ secrets.INFRACOST_API_KEY }}

  auto-pr-environment:
    needs: terraform
    # deploy-lightsail roda só em prod (push em main) — nunca em develop, então
    # não tem por que esse job esperar por ele. Antes ele ficava em needs
    # também, e como deploy-lightsail resolve sempre "skipped" em push de
    # develop, o GitHub Actions parava de avaliar o "if" custom e pulava este
    # job direto — nenhuma PR develop → main era aberta.
    if: |
      github.ref_name == 'develop' &&
      needs.terraform.result == 'success'
    uses: ./.github/workflows/pr_auto.yml
    with:
      branch_name: ${{ github.ref_name }}
    permissions:
      contents: write
      pull-requests: write

  deploy-lightsail:
    needs: [resolve-env, terraform]
    # FilmBot (Lightsail) existe só em prod — dev não provisiona mais
    # instância, IAM user do agente, DNS nem policies dedicadas de
    # Lightsail (ver infra/lightsail_ia.tf, infra/iam_cicd.tf). Só roda se
    # o Terraform aplicou com sucesso (não destruiu a infra).
    if: |
      needs.resolve-env.outputs.environment == 'prod' &&
      needs.terraform.result == 'success' &&
      needs.terraform.outputs.was_destroyed != 'true'
    uses: ./.github/workflows/deploy_lightsail.yml
    with:
      environment: ${{ needs.resolve-env.outputs.environment }}
    secrets:
      aws-assume-role-arn: ${{ secrets.AWS_ASSUME_ROLE_ARN_PROD }}
      aws-statefile-s3-bucket: ${{ secrets.AWS_STATEFILE_S3_BUCKET_PROD }}
      aws-lock-dynamodb-table: ${{ secrets.AWS_LOCK_DYNAMODB_TABLE_PROD }}

  sonar:
    # needs: resolve-env é só organizacional (agrupa visualmente no grafo da
    # Actions, ao lado de terraform/deploy-lightsail) — sonar não consome
    # nenhum output de resolve-env, roda em paralelo ao terraform (Terraform
    # provisiona infra, Sonar analisa código-fonte, nenhum depende do outro).
    # Só em push:main porque o plano Free do SonarQube Cloud só analisa de
    # forma contínua a branch marcada como "main" no projeto Sonar (ver
    # sonar-project.properties).
    needs: resolve-env
    if: github.ref_name == 'main'
    uses: ./.github/workflows/sonar.yml
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
