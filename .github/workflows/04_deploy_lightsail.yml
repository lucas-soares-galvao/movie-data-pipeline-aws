name: "4. Deploy Lightsail (Reusable)"

# =============================================================================
# Deploy do app configurado (nome/pasta em infra/config/project.json) na
# instância AWS Lightsail. Chamado pelo 00_pipeline.yml apenas em prod, após
# o Terraform aplicar com sucesso — FilmBot não existe em dev (ver
# infra/lightsail_ia.tf).
#
# Etapas principais:
#   1. Lê os outputs do Terraform (IP público, chave SSH, credenciais AWS do agente)
#   2. Aguarda a instância ficar disponível via SSH (até 30 tentativas, 10s cada)
#   3. Cria .env com credenciais na instância (sem passar por /tmp)
#   4. Restaura do S3 o certificado TLS do Caddy do ciclo anterior, se existir
#      (a instância é destruída/recriada diariamente — ver
#      infra/lightsail_scheduler_trigger.tf — e perde o disco a cada ciclo)
#   5. Clona ou atualiza o repositório (branch "main") e reinicia o serviço
#      systemd do app
#   6. Salva no S3 o certificado TLS do Caddy pós-deploy, para o próximo ciclo
# =============================================================================

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
    secrets:
      aws-assume-role-arn:
        required: true
      aws-statefile-s3-bucket:
        required: true
      aws-lock-dynamodb-table:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read project configuration
        id: project
        run: |
          CONFIG=infra/config/project.json
          echo "statefile_key=$(jq -r '.statefile_key' $CONFIG)" >> $GITHUB_OUTPUT
          echo "app_name=$(jq -r '.app_name' $CONFIG)" >> $GITHUB_OUTPUT
          echo "app_display_name=$(jq -r '.app_display_name' $CONFIG)" >> $GITHUB_OUTPUT
          echo "app_folder=$(jq -r '.app_folder' $CONFIG)" >> $GITHUB_OUTPUT

      # terraform_wrapper: false necessário para ler outputs como texto puro
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.3
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-assume-role-arn }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: sa-east-1

      - name: Terraform Init
        run: |
          cd infra && terraform init \
            -backend-config="bucket=${{ secrets.aws-statefile-s3-bucket }}" \
            -backend-config="key=${{ steps.project.outputs.statefile_key }}" \
            -backend-config="region=sa-east-1" \
            -backend-config="dynamodb_table=${{ secrets.aws-lock-dynamodb-table }}"

      - name: Get Terraform Outputs
        id: tf
        run: |
          cd infra

          PUBLIC_IP=$(terraform output -raw lightsail_public_ip)
          echo "public_ip=${PUBLIC_IP}" >> $GITHUB_OUTPUT
          echo "lightsail_enabled=$([[ -n "$PUBLIC_IP" ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

          INSTANCE_NAME=$(terraform output -raw lightsail_instance_name)
          echo "instance_name=${INSTANCE_NAME}" >> $GITHUB_OUTPUT

          if [ -z "$PUBLIC_IP" ]; then
            echo "⚠ Lightsail desabilitado — IP público vazio (instância não provisionada)"
            exit 0
          fi

          KEY_FILE=$(mktemp)
          terraform output -raw lightsail_private_key > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "key_file=${KEY_FILE}" >> $GITHUB_OUTPUT
          if [ ! -s "$KEY_FILE" ]; then
            echo "❌ Chave SSH privada está vazia — verificar output lightsail_private_key"
            exit 1
          fi

          ACCESS_KEY_ID=$(terraform output -raw lightsail_agent_access_key_id)
          echo "::add-mask::${ACCESS_KEY_ID}"
          echo "access_key_id=${ACCESS_KEY_ID}" >> $GITHUB_OUTPUT
          if [ -z "$ACCESS_KEY_ID" ]; then
            echo "❌ Access Key ID está vazio — verificar output lightsail_agent_access_key_id"
            exit 1
          fi

          SECRET_ACCESS_KEY=$(terraform output -raw lightsail_agent_secret_access_key)
          echo "::add-mask::${SECRET_ACCESS_KEY}"
          echo "secret_access_key=${SECRET_ACCESS_KEY}" >> $GITHUB_OUTPUT
          if [ -z "$SECRET_ACCESS_KEY" ]; then
            echo "❌ Secret Access Key está vazio — verificar output lightsail_agent_secret_access_key"
            exit 1
          fi

          CW_LOG_GROUP=$(terraform output -raw lightsail_cloudwatch_log_group)
          echo "cw_log_group=${CW_LOG_GROUP}" >> $GITHUB_OUTPUT

          FILMBOT_SECRET_ARN=$(terraform output -raw lightsail_filmbot_secret_arn)
          echo "::add-mask::${FILMBOT_SECRET_ARN}"
          echo "filmbot_secret_arn=${FILMBOT_SECRET_ARN}" >> $GITHUB_OUTPUT

          ATHENA_S3_OUTPUT=$(terraform output -raw lightsail_athena_s3_output)
          echo "athena_s3_output=${ATHENA_S3_OUTPUT}" >> $GITHUB_OUTPUT

          GLUE_DATABASE=$(terraform output -raw lightsail_glue_database)
          echo "glue_database=${GLUE_DATABASE}" >> $GITHUB_OUTPUT

          SPEC_TABLE=$(terraform output -raw lightsail_spec_table)
          echo "spec_table=${SPEC_TABLE}" >> $GITHUB_OUTPUT

          COGNITO_USER_POOL_ID=$(terraform output -raw lightsail_cognito_user_pool_id)
          echo "cognito_user_pool_id=${COGNITO_USER_POOL_ID}" >> $GITHUB_OUTPUT

          COGNITO_APP_CLIENT_ID=$(terraform output -raw lightsail_cognito_app_client_id)
          echo "cognito_app_client_id=${COGNITO_APP_CLIENT_ID}" >> $GITHUB_OUTPUT

          SNS_NEW_SIGNUP_TOPIC_ARN=$(terraform output -raw lightsail_sns_new_signup_topic_arn)
          echo "sns_new_signup_topic_arn=${SNS_NEW_SIGNUP_TOPIC_ARN}" >> $GITHUB_OUTPUT

          CADDY_CERTS_BUCKET=$(terraform output -raw lightsail_caddy_certs_bucket)
          echo "caddy_certs_bucket=${CADDY_CERTS_BUCKET}" >> $GITHUB_OUTPUT

          echo "✅ Terraform outputs lidos com sucesso (IP: $PUBLIC_IP)"

      - name: Check instance state
        if: steps.tf.outputs.lightsail_enabled == 'true'
        id: instance_check
        run: |
          STATE=$(aws lightsail get-instance \
            --instance-name "${{ steps.tf.outputs.instance_name }}" \
            --region us-east-1 \
            --query 'instance.state.name' \
            --output text)
          echo "Lightsail instance state: $STATE"
          if [ "$STATE" == "running" ]; then
            echo "instance_running=true" >> $GITHUB_OUTPUT
            echo "✅ Instância está rodando — prosseguindo com deploy"
          else
            echo "instance_running=false" >> $GITHUB_OUTPUT
            echo "::warning::Instância está '$STATE' — deploy será ignorado"
          fi

      # chmod 600 obrigatório — SSH rejeita chaves com permissões mais abertas
      - name: Setup SSH key
        if: steps.tf.outputs.lightsail_enabled == 'true' && steps.instance_check.outputs.instance_running == 'true'
        run: |
          mkdir -p ~/.ssh
          cp "${{ steps.tf.outputs.key_file }}" ~/.ssh/${{ steps.project.outputs.app_name }}_key
          chmod 600 ~/.ssh/${{ steps.project.outputs.app_name }}_key
          SSH_READY=0
          for i in $(seq 1 30); do
            ssh-keyscan -T 5 -H "${{ steps.tf.outputs.public_ip }}" >> ~/.ssh/known_hosts 2>/dev/null && { SSH_READY=1; break; }
            echo "Tentativa $i/30 — aguardando SSH..."
            sleep 10
          done
          if [ $SSH_READY -eq 0 ]; then
            echo "❌ SSH indisponível após 5 minutos — abortando."
            exit 1
          fi
          echo "✅ SSH disponível após $((i * 10))s (tentativa $i/30)"

      # Credenciais criadas diretamente no destino final (não em /tmp — world-readable)
      - name: Create .env file on instance
        if: steps.tf.outputs.lightsail_enabled == 'true' && steps.instance_check.outputs.instance_running == 'true'
        run: |
          printf 'AWS_ACCESS_KEY_ID=%s\nAWS_SECRET_ACCESS_KEY=%s\nAWS_REGION=sa-east-1\nFILMBOT_SECRET_ARN=%s\nATHENA_S3_OUTPUT=%s\nGLUE_DATABASE=%s\nSPEC_TABLE=%s\nCLOUDWATCH_LOG_GROUP=%s\nCOGNITO_USER_POOL_ID=%s\nCOGNITO_APP_CLIENT_ID=%s\nSNS_NEW_SIGNUP_TOPIC_ARN=%s\n' \
            "${{ steps.tf.outputs.access_key_id }}" \
            "${{ steps.tf.outputs.secret_access_key }}" \
            "${{ steps.tf.outputs.filmbot_secret_arn }}" \
            "${{ steps.tf.outputs.athena_s3_output }}" \
            "${{ steps.tf.outputs.glue_database }}" \
            "${{ steps.tf.outputs.spec_table }}" \
            "${{ steps.tf.outputs.cw_log_group }}" \
            "${{ steps.tf.outputs.cognito_user_pool_id }}" \
            "${{ steps.tf.outputs.cognito_app_client_id }}" \
            "${{ steps.tf.outputs.sns_new_signup_topic_arn }}" \
            | ssh -i ~/.ssh/${{ steps.project.outputs.app_name }}_key ubuntu@${{ steps.tf.outputs.public_ip }} \
                "sudo mkdir -p /opt/${{ steps.project.outputs.app_name }}/app/${{ steps.project.outputs.app_folder }} && sudo tee /opt/${{ steps.project.outputs.app_name }}/app/${{ steps.project.outputs.app_folder }}/.env > /dev/null && sudo chmod 600 /opt/${{ steps.project.outputs.app_name }}/app/${{ steps.project.outputs.app_folder }}/.env"
          ssh -i ~/.ssh/${{ steps.project.outputs.app_name }}_key ubuntu@${{ steps.tf.outputs.public_ip }} \
            "test -s /opt/${{ steps.project.outputs.app_name }}/app/${{ steps.project.outputs.app_folder }}/.env" || { echo "❌ Arquivo .env não foi criado na instância"; exit 1; }
          echo "✅ Arquivo .env criado com sucesso na instância"

      # Domínio fixo — este workflow só é chamado para prod (ver
      # 00_pipeline.yml). Caddyfile lê {$FILMBOT_DOMAIN} do ambiente do
      # processo via EnvironmentFile=.
      - name: Create .env.caddy file on instance
        if: steps.tf.outputs.lightsail_enabled == 'true' && steps.instance_check.outputs.instance_running == 'true'
        run: |
          DOMAIN="filmbot.lsgalvao.com.br"
          printf 'FILMBOT_DOMAIN=%s\n' "$DOMAIN" \
            | ssh -i ~/.ssh/${{ steps.project.outputs.app_name }}_key ubuntu@${{ steps.tf.outputs.public_ip }} \
                "sudo mkdir -p /opt/${{ steps.project.outputs.app_name }}/app/${{ steps.project.outputs.app_folder }} && sudo tee /opt/${{ steps.project.outputs.app_name }}/app/${{ steps.project.outputs.app_folder }}/.env.caddy > /dev/null && sudo chmod 600 /opt/${{ steps.project.outputs.app_name }}/app/${{ steps.project.outputs.app_folder }}/.env.caddy"
          echo "✅ Arquivo .env.caddy criado com sucesso na instância (FILMBOT_DOMAIN=$DOMAIN)"

      # A instância é destruída e recriada diariamente (ver
      # infra/lightsail_scheduler_trigger.tf), o que apaga o diretório de
      # certificados do Caddy junto com o disco raiz. Sem restaurar aqui antes
      # do restart, o Caddy pede um certificado novo do Let's Encrypt a cada
      # ciclo e esbarra no rate limit de certificados duplicados (5/semana).
      # Falha no download é esperada no primeiro deploy (bucket ainda vazio).
      - name: Restore Caddy cert data from S3
        if: steps.tf.outputs.lightsail_enabled == 'true' && steps.instance_check.outputs.instance_running == 'true'
        run: |
          if aws s3 cp "s3://${{ steps.tf.outputs.caddy_certs_bucket }}/caddy-data.tar.gz" /tmp/caddy-data.tar.gz 2>/dev/null; then
            scp -i ~/.ssh/${{ steps.project.outputs.app_name }}_key /tmp/caddy-data.tar.gz ubuntu@${{ steps.tf.outputs.public_ip }}:/tmp/caddy-data.tar.gz
            ssh -i ~/.ssh/${{ steps.project.outputs.app_name }}_key ubuntu@${{ steps.tf.outputs.public_ip }} \
              "sudo mkdir -p /root/.local/share/caddy && sudo tar -xzf /tmp/caddy-data.tar.gz -C /root/.local/share/caddy && rm -f /tmp/caddy-data.tar.gz"
            rm -f /tmp/caddy-data.tar.gz
            echo "✅ Certificado do Caddy restaurado do S3"
            echo "::group::Conteúdo restaurado — arquivos em /root/.local/share/caddy"
            ssh -i ~/.ssh/${{ steps.project.outputs.app_name }}_key ubuntu@${{ steps.tf.outputs.public_ip }} \
              "sudo find /root/.local/share/caddy -maxdepth 6 -type f" || true
            echo "::endgroup::"
          else
            echo "ℹ Nenhum certificado salvo no S3 ainda (primeiro deploy) — Caddy vai emitir um novo"
          fi

      - name: Deploy app
        if: steps.tf.outputs.lightsail_enabled == 'true' && steps.instance_check.outputs.instance_running == 'true'
        run: |
          DEPLOY_BRANCH="main"
          ssh -i ~/.ssh/${{ steps.project.outputs.app_name }}_key ubuntu@${{ steps.tf.outputs.public_ip }} \
            BRANCH="$DEPLOY_BRANCH" \
            APP_NAME="${{ steps.project.outputs.app_name }}" \
            APP_FOLDER="${{ steps.project.outputs.app_folder }}" \
            REPO_URL="https://github.com/${{ github.repository }}.git" \
            bash << 'ENDSSH'
            set -e

            # Swap de 1GB — necessário em bundles pequenos (ex.: nano_3_0, 512MB)
            # para o pip install/app não sofrerem OOM kill. Idempotente e
            # aplicado em qualquer bundle — custo de disco desprezível.
            if [ ! -f /swapfile ]; then
              sudo fallocate -l 1G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi

            sudo apt-get update -q && sudo apt-get install -y python3-venv python3-pip git debian-keyring debian-archive-keyring apt-transport-https curl -q
            sudo useradd -m "$APP_NAME" || true

            # Instalar Caddy (proxy reverso HTTPS) se ainda não instalado
            if ! command -v caddy &> /dev/null; then
              curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
              curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | sudo tee /etc/apt/sources.list.d/caddy-stable.list
              sudo apt-get update -q && sudo apt-get install -y caddy -q
            fi

            APP_DIR="/opt/$APP_NAME"

            if [ -d "$APP_DIR/.git" ]; then
              echo "==> Atualizando código existente (branch: $BRANCH)..."
              sudo git config --global --add safe.directory "$APP_DIR"
              cd "$APP_DIR"
              sudo git fetch origin
              sudo git checkout "$BRANCH"
              sudo git pull origin "$BRANCH"
              sudo chown -R "$APP_NAME:$APP_NAME" "$APP_DIR"
              sudo chown "$APP_NAME:$APP_NAME" "$APP_DIR/app/$APP_FOLDER/.env"
              # Força regeneração do secrets.toml a partir do Secrets Manager a cada deploy
              # (load_filmbot_password() só escreve o arquivo se ele ainda não existir)
              sudo rm -f "$APP_DIR/app/$APP_FOLDER/.streamlit/secrets.toml"
              cd "$APP_DIR/app/$APP_FOLDER"
              sudo python3 -m venv .venv
              sudo .venv/bin/pip install --upgrade pip -q
              sudo .venv/bin/pip install -r requirements.txt -q
              sudo cp "deploy/$APP_NAME.service" "/etc/systemd/system/$APP_NAME.service"
              sudo cp deploy/caddy.service /etc/systemd/system/caddy.service
              sudo systemctl daemon-reload
              sudo systemctl enable "$APP_NAME" caddy
              sudo systemctl restart "$APP_NAME" caddy
            else
              echo "==> Primeiro deploy (branch: $BRANCH)..."
              sudo git clone -b "$BRANCH" "$REPO_URL" "/tmp/${APP_NAME}_new"
              sudo cp -rn "/tmp/${APP_NAME}_new/." "$APP_DIR/"
              sudo rm -rf "/tmp/${APP_NAME}_new"
              sudo git config --global --add safe.directory "$APP_DIR"
              sudo chown -R "$APP_NAME:$APP_NAME" "$APP_DIR"
              sudo chown "$APP_NAME:$APP_NAME" "$APP_DIR/app/$APP_FOLDER/.env"
              cd "$APP_DIR/app/$APP_FOLDER"
              sudo python3 -m venv .venv
              sudo .venv/bin/pip install --upgrade pip -q
              sudo .venv/bin/pip install -r requirements.txt -q
              sudo cp "$APP_DIR/app/$APP_FOLDER/deploy/$APP_NAME.service" "/etc/systemd/system/$APP_NAME.service"
              sudo cp "$APP_DIR/app/$APP_FOLDER/deploy/caddy.service" /etc/systemd/system/caddy.service
              sudo systemctl daemon-reload
              sudo systemctl enable "$APP_NAME" caddy
              sudo systemctl restart "$APP_NAME" caddy
            fi
            sudo systemctl status "$APP_NAME" --no-pager
            sudo systemctl status caddy --no-pager

            if sudo systemctl is-active --quiet "$APP_NAME" && sudo systemctl is-active --quiet caddy; then
              echo "✅ Serviços $APP_NAME e caddy ativos"
            else
              echo "❌ Um ou mais serviços não estão ativos:"
              sudo systemctl is-active "$APP_NAME" || echo "   - $APP_NAME: inativo"
              sudo systemctl is-active caddy || echo "   - caddy: inativo"
              exit 1
            fi
          ENDSSH
          echo "✅ Deploy concluído com sucesso na instância ${{ steps.tf.outputs.public_ip }}"

      - name: Health Check
        if: steps.tf.outputs.lightsail_enabled == 'true' && steps.instance_check.outputs.instance_running == 'true'
        run: |
          APP_OK=0
          for i in $(seq 1 6); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://${{ steps.tf.outputs.public_ip }}" || true)
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
              echo "✅ Health check OK — HTTP $HTTP_CODE após $((i * 5))s (tentativa $i/6)"
              APP_OK=1
              break
            fi
            echo "Tentativa $i/6 — HTTP $HTTP_CODE, aguardando 5s..."
            sleep 5
          done
          if [ $APP_OK -eq 0 ]; then
            echo "⚠ Health check retornou HTTP $HTTP_CODE após 30s — app pode ainda estar iniciando"
          fi

      # Salva o certificado do Caddy pra este deploy no S3, pro próximo ciclo
      # de recriação da instância restaurar em vez de reemitir (ver "Restore
      # Caddy cert data from S3" acima). O health check anterior só confirma
      # que o Caddy está respondendo (redirect HTTP→HTTPS) — não que a emissão
      # ACME (round-trip HTTP-01 com o Let's Encrypt/ZeroSSL) já terminou e
      # gravou o certificado em disco. Por isso faz poll (até 30×10s, mesmo
      # padrão do step "Setup SSH key" acima) em vez de checar uma única vez.
      #
      # A checagem exige um .crt de verdade sob certificates/ — não basta o
      # diretório existir/não-estar-vazio: o Caddy já cria a pasta da conta
      # ACME (acme/.../users/default/default.json) nos primeiros segundos da
      # emissão, bem antes de ter um certificado válido, e um "Restore" bem-
      # sucedido também deixa o diretório não-vazio na hora, sem garantir que
      # o que foi restaurado é um certificado utilizável. Uma checagem mais
      # fraca (só "não está vazio") já causou o salvamento de um estado
      # incompleto na prática.
      # Se mesmo assim não aparecer, despeja journalctl/status/conteúdo do
      # diretório pro log do Actions — diagnóstico melhor do que só o aviso.
      - name: Save Caddy cert data to S3
        if: steps.tf.outputs.lightsail_enabled == 'true' && steps.instance_check.outputs.instance_running == 'true'
        run: |
          CERT_READY=0
          for i in $(seq 1 30); do
            if ssh -i ~/.ssh/${{ steps.project.outputs.app_name }}_key ubuntu@${{ steps.tf.outputs.public_ip }} \
              "sudo bash -c 'find /root/.local/share/caddy/certificates -type f -iname \"*.crt\" 2>/dev/null | grep -q .'"; then
              CERT_READY=1
              break
            fi
            echo "Tentativa $i/30 — certificado do Caddy ainda não disponível, aguardando 10s..."
            sleep 10
          done

          if [ $CERT_READY -eq 1 ]; then
            echo "::group::Certificado encontrado — arquivos em /root/.local/share/caddy"
            ssh -i ~/.ssh/${{ steps.project.outputs.app_name }}_key ubuntu@${{ steps.tf.outputs.public_ip }} \
              "sudo find /root/.local/share/caddy -maxdepth 6 -type f" || true
            echo "::endgroup::"
            ssh -i ~/.ssh/${{ steps.project.outputs.app_name }}_key ubuntu@${{ steps.tf.outputs.public_ip }} \
              "sudo tar -czf /tmp/caddy-data.tar.gz -C /root/.local/share/caddy . && sudo chmod 644 /tmp/caddy-data.tar.gz"
            scp -i ~/.ssh/${{ steps.project.outputs.app_name }}_key ubuntu@${{ steps.tf.outputs.public_ip }}:/tmp/caddy-data.tar.gz /tmp/caddy-data.tar.gz
            aws s3 cp /tmp/caddy-data.tar.gz "s3://${{ steps.tf.outputs.caddy_certs_bucket }}/caddy-data.tar.gz"
            ssh -i ~/.ssh/${{ steps.project.outputs.app_name }}_key ubuntu@${{ steps.tf.outputs.public_ip }} "sudo rm -f /tmp/caddy-data.tar.gz"
            rm -f /tmp/caddy-data.tar.gz
            echo "✅ Certificado do Caddy salvo no S3"
          else
            echo "⚠ Certificado do Caddy não apareceu em /root/.local/share/caddy após 300s — nada para salvar (emissão pode ainda estar em andamento ou ter falhado)"
            echo "::group::Diagnóstico — journalctl -u caddy (últimas 150 linhas)"
            ssh -i ~/.ssh/${{ steps.project.outputs.app_name }}_key ubuntu@${{ steps.tf.outputs.public_ip }} \
              "sudo journalctl -u caddy --no-pager -n 150" || true
            echo "::endgroup::"
            echo "::group::Diagnóstico — systemctl status caddy"
            ssh -i ~/.ssh/${{ steps.project.outputs.app_name }}_key ubuntu@${{ steps.tf.outputs.public_ip }} \
              "sudo systemctl status caddy --no-pager" || true
            echo "::endgroup::"
            echo "::group::Diagnóstico — conteúdo de /root/.local/share/caddy"
            ssh -i ~/.ssh/${{ steps.project.outputs.app_name }}_key ubuntu@${{ steps.tf.outputs.public_ip }} \
              "sudo find /root/.local/share/caddy -maxdepth 4 2>&1 || echo '(diretório não existe)'" || true
            echo "::endgroup::"
          fi

      - name: Show app URL
        if: steps.tf.outputs.lightsail_enabled == 'true'
        run: |
          DOMAIN="filmbot.lsgalvao.com.br"
          echo "🔗 ${{ steps.project.outputs.app_display_name }}: https://$DOMAIN"
          echo "## 🔗 ${{ steps.project.outputs.app_display_name }}" >> $GITHUB_STEP_SUMMARY
          echo "https://$DOMAIN" >> $GITHUB_STEP_SUMMARY
