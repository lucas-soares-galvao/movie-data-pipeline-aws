name: 5. Backfill
run-name: "Backfill [${{ github.ref_name == 'main' && 'PROD' || 'DEV' }}]: ${{ inputs.table_group }} (${{ inputs.start_year }}-${{ inputs.end_year != '' && inputs.end_year || 'atual' }})"

# =============================================================================
# Executa backfills pontuais sob demanda.
#
# O ambiente (dev/prod) é resolvido automaticamente a partir do branch
# selecionado em "Use workflow from" ao disparar o workflow:
#   - main    → prod
#   - develop → dev
#   - qualquer outro branch → falha (ver step "Resolve environment from branch")
#
# Grupos de tabelas disponíveis:
#   - discover              — popula as tabelas discover rodando a coleta TMDB e a transformação
#                             equivalente ao Glue ETL localmente neste workflow (sem acionar Lambda
#                             nem o job Glue ETL — ver scripts/backfill_discover.py), disparando o
#                             Glue Data Quality uma única vez ao final, cobrindo todo o range de
#                             anos processado
#   - referencias           — atualiza genre, configuration, watch_providers_ref rodando a coleta
#                             TMDB e a transformação equivalente ao Glue ETL localmente neste
#                             workflow (sem acionar Lambda nem o job Glue ETL — ver
#                             scripts/backfill_referencias.py), disparando o Glue Data Quality uma
#                             vez por tabela gravada
#   - detalhes_e_providers  — re-enriquece details + watch_providers rodando a lógica do Glue
#                             Details localmente neste workflow (sem acionar o job Glue — ver
#                             scripts/backfill_enriquecimento.py), disparando o Glue Data Quality
#                             uma única vez ao final, cobrindo todo o range de anos processado
#   - data_quality          — re-executa DQ via Glue
#   - traducao              — adiciona overview_pt nos details (sem API TMDB)
#   - rename_colunas        — migra dt_processamento/dt_atualizacao para
#                             processed_date/updated_date nos parquets já gravados
#                             (sem API TMDB — ver scripts/backfill_rename_colunas.py)
#   - changes               — dispara sob demanda o mesmo modo changes que o cron semanal de
#                             domingo já aciona automaticamente (janela fixa de 7 dias, sem
#                             start_year/end_year), rodando a coleta de IDs mudados e o
#                             enriquecimento localmente neste workflow (sem acionar Lambda nem
#                             o job Glue Details — ver scripts/backfill_changes.py), disparando
#                             o Glue Data Quality uma única vez ao final por tabela
#   - historico             — encadeia discover e detalhes_e_providers num único run (ver
#                             scripts/backfill_historico.py), chamando os dois scripts acima em
#                             sequência no mesmo processo; mantém um checkpoint próprio por
#                             estágio (além do checkpoint por ano/tipo de cada um) para não
#                             redigitar um estágio já concluído numa retomada; herda os 2
#                             disparos de Glue Data Quality dos dois scripts (não dispara um
#                             terceiro consolidado)
#
# translate_provider escolhe o serviço de tradução usado por qualquer um dos grupos
# acima que traduz (discover, referencias, detalhes_e_providers, traducao, changes) —
# "google" (grátis) é o default de todo backfill manual; "aws" (AWS Translate, pago
# por caractere) é útil para testar um período menor via start_year/end_year.
#
# Ao final de qualquer execução bem-sucedida (exit 0), o workflow escreve no step
# summary um resumo real do que o script de backfill fez (não só "sucesso" pelo exit
# code — para detalhes_e_providers/data_quality, exit 0 não garante que toda unidade
# teve sucesso, ver scripts/scripts.md). Cada table_group EXCETO data_quality (que só
# valida, não escreve dado novo) roda a lógica do Glue AGG (query Athena de unificação
# + escrita da tabela SPEC + disparo do Data Quality sobre a tabela unificada) dentro
# do próprio processo do script, uma única vez, no mesmo ponto em que hoje já limpa o
# checkpoint — ver scripts/backfill_shared.py:trigger_agg_locally e as docstrings de
# cada script ("Glue AGG"). Chamada síncrona (awswrangler bloqueia até terminar), sem
# precisar de polling via AWS CLI como antes. Uma falha nessa etapa é logada como
# ERROR mas não derruba o backfill (que já terminou com sucesso) — o trigger agendado
# (sábado/domingo 08:00 BRT, aws_glue_trigger.agg_weekly em infra/glue_agg.tf) e o
# alarme SNS de falha (infra/cloudwatch_glue_alarms.tf) continuam cobrindo o caso.
#
# Todas as variáveis de ambiente dos recursos AWS são derivadas automaticamente
# do padrão de nomenclatura do Terraform (tmdb-*-<env> / db_tmdb_*_<env> / etc.).
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      table_group:
        description: "Grupo de tabelas a atualizar"
        required: true
        type: choice
        options:
          - discover
          - referencias
          - detalhes_e_providers
          - data_quality
          - traducao
          - rename_colunas
          - changes
          - historico
      start_year:
        description: "Ano inicial (ignorado para referencias e changes)"
        required: true
        default: "2000"
        type: string
      end_year:
        description: "Ano final (vazio = ano atual; ignorado para referencias e changes)"
        required: false
        default: ""
        type: string
      translate_provider:
        description: "Serviço de tradução (google = grátis, aws = pago por caractere — útil para testar um período menor)"
        required: false
        default: "google"
        type: choice
        options:
          - google
          - aws

permissions:
  id-token: write
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve environment from branch
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "name=prod" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            echo "name=dev" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Branch '${{ github.ref_name }}' inválido — dispare este workflow a partir de 'main' (prod) ou 'develop' (dev)."
            exit 1
          fi
          echo "🌎 Ambiente resolvido a partir do branch '${{ github.ref_name }}'"

      - name: Read project configuration
        id: project
        run: |
          echo "project_prefix=$(jq -r '.project_prefix' infra/config/project.json)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.env.outputs.name == 'prod' && secrets.AWS_ASSUME_ROLE_ARN_BACKFILL_PROD || secrets.AWS_ASSUME_ROLE_ARN_BACKFILL_DEV }}
          role-session-name: GitHub_to_AWS_Backfill
          aws-region: sa-east-1
          # Sessão padrão de 1h (default da action). Backfills históricos podem
          # rodar por horas e a sessão expira antes do fim — em vez de esticar
          # a duração, o step "Run backfill" abaixo trata
          # ExpiredTokenException especificamente: renova a credencial (nova
          # sessão de 1h via OIDC) e retoma o script do checkpoint em S3, sem
          # perder o progresso já feito (ver scripts/backfill_shared.py).

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # tzdata é do backfill_shared.py (compartilhado pelos 8 scripts, ver
          # Formatter.converter de horário de São Paulo) — instalado sempre, não só
          # nos 2 table_group abaixo, para não depender da base IANA do runner.
          pip install boto3 tzdata
          if [ "${{ inputs.table_group }}" = "discover" ] || [ "${{ inputs.table_group }}" = "traducao" ] || [ "${{ inputs.table_group }}" = "rename_colunas" ] || [ "${{ inputs.table_group }}" = "detalhes_e_providers" ] || [ "${{ inputs.table_group }}" = "changes" ] || [ "${{ inputs.table_group }}" = "referencias" ] || [ "${{ inputs.table_group }}" = "historico" ]; then
            pip install -r scripts/requirements_backfill.txt
          fi

      - name: Run backfill (${{ inputs.table_group }})
        env:
          AWS_REGION: sa-east-1
          FORCE_REFETCH: "true"
          TABLE_GROUP: ${{ inputs.table_group }}
          TRANSLATE_PROVIDER: ${{ inputs.translate_provider }}

          # Role para renovar a credencial via OIDC se ExpiredTokenException ocorrer no meio do backfill
          ROLE_ARN: ${{ steps.env.outputs.name == 'prod' && secrets.AWS_ASSUME_ROLE_ARN_BACKFILL_PROD || secrets.AWS_ASSUME_ROLE_ARN_BACKFILL_DEV }}

          # Jobs
          # GLUE_DETAILS_JOB_NAME não é mais passada: backfill_enriquecimento.py roda a lógica de
          # enriquecimento diretamente no processo do backfill (ver
          # run_details_and_watch_providers_for_year em app/glue_details/src/utils.py), sem mais
          # acionar o Glue Details como job. GLUE_AGG_JOB_NAME também não é mais passada pelo
          # mesmo motivo: cada script roda o Glue AGG em processo (ver
          # scripts/backfill_shared.py:trigger_agg_locally) — sem acionar `aws glue
          # start-job-run` para o AGG.
          GLUE_DATA_QUALITY_JOB_NAME: ${{ steps.project.outputs.project_prefix }}-glue-data-quality-${{ steps.env.outputs.name }}

          # Glue AGG (executado dentro do próprio script de backfill, ver "Glue AGG" no
          # comentário de topo deste arquivo) — nomes derivados do mesmo padrão de nomenclatura
          # já usado acima (project_prefix + ambiente), sem precisar de novo output do Terraform.
          # Não usado por data_quality (único table_group que não roda o AGG).
          ENVIRONMENT: ${{ steps.env.outputs.name }}
          S3_PREFIX_SPEC: ${{ steps.project.outputs.project_prefix }}
          S3_BUCKET_SPEC: lsg-sa-east-1-bucket-spec-${{ steps.env.outputs.name }}
          DB_UNIFIED: db_${{ steps.project.outputs.project_prefix }}_unified_${{ steps.env.outputs.name }}
          TABLE_DISCOVER_UNIFIED: tb_${{ steps.project.outputs.project_prefix }}_discover_unified_${{ steps.env.outputs.name }}

          # Secret com a chave de API do TMDB — mesmo ARN usado por infra/glue_details.tf (argumento
          # TMDB_SECRET_ARN do job real). Este workflow é workflow_dispatch (não workflow_call), então
          # lê direto o secret do repositório por ambiente (mesmo par usado em
          # 00_pipeline.yml:aws-filmbot-secret-arn), e não o secret de input "aws-filmbot-secret-arn"
          # de 02_terraform.yml (esse só existe dentro do contexto workflow_call daquele workflow). Lido
          # por backfill_discover.py, backfill_enriquecimento.py, backfill_changes.py e
          # backfill_referencias.py (via get_api_secret), que precisam da chave para chamar a API
          # do TMDB fora do runtime do Glue/Lambda.
          TMDB_SECRET_ARN: ${{ steps.env.outputs.name == 'prod' && secrets.AWS_FILMBOT_SECRET_ARN_PROD || secrets.AWS_FILMBOT_SECRET_ARN_DEV }}

          # Databases
          GLUE_DATABASE_MOVIE: db_${{ steps.project.outputs.project_prefix }}_movie_${{ steps.env.outputs.name }}
          GLUE_DATABASE_TV: db_${{ steps.project.outputs.project_prefix }}_tv_${{ steps.env.outputs.name }}

          # Buckets
          # SOR: JSON bruto coletado do TMDB (backfill_discover.py, que escreve discover, e
          # backfill_referencias.py, que escreve genre/configuration/watch_providers_ref — ambos no
          # mesmo layout que a Lambda API usaria)
          # SOT: parquets reais de discover (backfill_discover.py e backfill_traducao.py),
          # details (backfill_traducao.py) e das 6 tabelas de referência (backfill_referencias.py)
          # TEMP: checkpoint de retomada dos scripts que iteram por ano
          S3_BUCKET_SOR: lsg-sa-east-1-bucket-sor-${{ steps.env.outputs.name }}
          S3_BUCKET_SOT: lsg-sa-east-1-bucket-sot-${{ steps.env.outputs.name }}
          S3_BUCKET_TEMP: lsg-sa-east-1-bucket-temp-${{ steps.env.outputs.name }}

          # Tabelas
          TABLE_DISCOVER_MOVIE: tb_${{ steps.project.outputs.project_prefix }}_discover_movie_${{ steps.env.outputs.name }}
          TABLE_DISCOVER_TV: tb_${{ steps.project.outputs.project_prefix }}_discover_tv_${{ steps.env.outputs.name }}
          TABLE_GENRE_MOVIE: tb_${{ steps.project.outputs.project_prefix }}_genre_movie_${{ steps.env.outputs.name }}
          TABLE_GENRE_TV: tb_${{ steps.project.outputs.project_prefix }}_genre_tv_${{ steps.env.outputs.name }}
          TABLE_CONFIGURATION_LANGUAGES: tb_${{ steps.project.outputs.project_prefix }}_configuration_languages_${{ steps.env.outputs.name }}
          TABLE_CONFIGURATION_COUNTRIES: tb_${{ steps.project.outputs.project_prefix }}_configuration_countries_${{ steps.env.outputs.name }}
          TABLE_DETAILS_MOVIE: tb_${{ steps.project.outputs.project_prefix }}_details_movie_${{ steps.env.outputs.name }}
          TABLE_DETAILS_TV: tb_${{ steps.project.outputs.project_prefix }}_details_tv_${{ steps.env.outputs.name }}
          TABLE_WATCH_PROVIDERS_MOVIE: tb_${{ steps.project.outputs.project_prefix }}_watch_providers_movie_${{ steps.env.outputs.name }}
          TABLE_WATCH_PROVIDERS_TV: tb_${{ steps.project.outputs.project_prefix }}_watch_providers_tv_${{ steps.env.outputs.name }}
          TABLE_WATCH_PROVIDERS_REF_MOVIE: tb_${{ steps.project.outputs.project_prefix }}_watch_providers_ref_movie_${{ steps.env.outputs.name }}
          TABLE_WATCH_PROVIDERS_REF_TV: tb_${{ steps.project.outputs.project_prefix }}_watch_providers_ref_tv_${{ steps.env.outputs.name }}
          BACKFILL_START_YEAR: ${{ inputs.start_year }}
        run: |
          if [ -n "${{ inputs.end_year }}" ]; then
            export BACKFILL_END_YEAR="${{ inputs.end_year }}"
          fi

          executar_script() {
            case "${{ inputs.table_group }}" in
              discover)             python scripts/backfill_discover.py ;;
              referencias)          python scripts/backfill_referencias.py ;;
              detalhes_e_providers) python scripts/backfill_enriquecimento.py ;;
              data_quality)         python scripts/backfill_data_quality.py ;;
              traducao)             python scripts/backfill_traducao.py ;;
              rename_colunas)       python scripts/backfill_rename_colunas.py ;;
              changes)              python scripts/backfill_changes.py ;;
              historico)            python scripts/backfill_historico.py ;;
            esac
          }

          # Re-assume a role via OIDC (mesma mecânica de aws-actions/configure-aws-credentials,
          # inline para poder repetir a cada tentativa) e exporta uma sessão nova de 1h.
          renovar_credenciais() {
            echo "Token expirado — renovando credenciais AWS (nova sessão de 1h via OIDC)..."
            oidc_token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
            creds=$(aws sts assume-role-with-web-identity \
              --role-arn "$ROLE_ARN" \
              --role-session-name GitHub_to_AWS_Backfill \
              --web-identity-token "$oidc_token" \
              --duration-seconds 3600 \
              --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
              --output text)
            export AWS_ACCESS_KEY_ID=$(echo "$creds" | cut -f1)
            export AWS_SECRET_ACCESS_KEY=$(echo "$creds" | cut -f2)
            export AWS_SESSION_TOKEN=$(echo "$creds" | cut -f3)
          }

          # Nota: backfill_referencias.py e backfill_changes.py não iteram por ano nem gravam
          # checkpoint (poucas unidades — 6 e 2, respectivamente — ambos idempotentes). Fazem
          # chamadas reais de S3/Secrets/TMDB (backfill_referencias.py) ou Athena/S3/Secrets/TMDB
          # (backfill_changes.py) diretamente no processo (não mais uma invocação curta de
          # Lambda) e podem sair com código 75 se a credencial expirar no meio do run — esse loop
          # genérico já cobre o retry, sem checkpoint: a próxima tentativa refaz tudo do zero.
          # backfill_rename_colunas.py itera por tabela x ano (não por media_type) e usa
          # o mesmo checkpoint/retry dos demais.
          # max_tentativas alinhado ao timeout-minutes do job (360min / ~1h por sessão AWS) —
          # se o timeout mudar, ajustar aqui também.
          # ARN do tópico SNS de sucesso do backfill (scripts/backfill_shared.py:
          # notify_backfill_success) — nome derivado do mesmo padrão de nomenclatura
          # (project_prefix + ambiente) já usado acima; account_id extraído de ROLE_ARN (já
          # disponível no env: deste step) em vez de aws sts get-caller-identity (chamada AWS
          # extra) ou de um output novo do Terraform.
          account_id=$(echo "$ROLE_ARN" | cut -d: -f5)
          export SNS_TOPIC_ARN_BACKFILL_SUCCESS="arn:aws:sns:sa-east-1:${account_id}:${{ steps.project.outputs.project_prefix }}-backfill-success-notifications-${{ steps.env.outputs.name }}"

          LOG_FILE="$RUNNER_TEMP/backfill_output.log"
          : > "$LOG_FILE"

          max_tentativas=6
          tentativa=1
          while true; do
            echo "Tentativa $tentativa/$max_tentativas..."
            # set +e/-e: sob "set -e" (padrão dos steps run: do GitHub Actions), um
            # exit code != 0 de executar_script derruba o script aqui mesmo, antes de
            # "codigo=$?" rodar — o retry abaixo nunca seria alcançado.
            # A saída também é gravada em $LOG_FILE (via tee, mantendo a visibilidade
            # ao vivo no log do Actions) para extrair o resumo real do backfill depois
            # do loop — codigo=${PIPESTATUS[0]} pega o exit code do script, não do tee.
            set +e
            executar_script 2>&1 | tee -a "$LOG_FILE"
            codigo=${PIPESTATUS[0]}
            set -e
            if [ $codigo -eq 0 ]; then
              echo "Backfill concluído com sucesso."
              break
            elif [ $codigo -eq 75 ] && [ $tentativa -lt $max_tentativas ]; then
              tentativa=$((tentativa + 1))
              renovar_credenciais
            else
              echo "Backfill falhou (código $codigo)."
              exit $codigo
            fi
          done

          # --- Backfill: resumo real extraído do log, antes da seção do glue_agg ---
          # Todos os scripts usam o mesmo formato de log (backfill_shared.py:
          # "%(asctime)s %(levelname)s %(message)s"), então isso funciona igual para os
          # 8 scripts sem lógica por table_group. Importante para detalhes_e_providers
          # (soft-fail-continue) e data_quality (fire-and-forget): "exit 0" não garante
          # que toda unidade teve sucesso — ver scripts/scripts.md.
          echo "## Backfill (\`${{ inputs.table_group }}\`)" >> "$GITHUB_STEP_SUMMARY"

          resumo_final=$(grep -E "conclu[ií]d|atualizadas|disparado com sucesso|submetidas" "$LOG_FILE" | tail -1 || true)
          if [ -n "$resumo_final" ]; then
            echo "- $resumo_final" >> "$GITHUB_STEP_SUMMARY"
          fi

          erros=$(grep " ERROR " "$LOG_FILE" || true)
          if [ -n "$erros" ]; then
            echo "::warning::Backfill terminou com exit 0, mas há linha(s) de ERROR no log — revisar antes de considerar 100% completo."
            {
              echo "- ⚠️ **Falhas parciais registradas** (script terminou com sucesso mas nem toda unidade foi processada):"
              echo '```'
              echo "$erros"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ✅ Sem erros registrados no log." >> "$GITHUB_STEP_SUMMARY"
          fi

          # --- glue_agg: agora executado dentro do próprio script de backfill ---
          # A query Athena e a escrita Parquet já são síncronas (awswrangler bloqueia até
          # terminar) — sem polling necessário, diferente do antigo `aws glue start-job-run`.
          # Erros/sucesso do AGG aparecem como linhas de log normais (mesmo $LOG_FILE, ver seção
          # "Backfill" acima) — ver scripts/backfill_shared.py:trigger_agg_locally.
          echo "## glue_agg" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.table_group }}" != "data_quality" ]; then
            echo "- Executado dentro do próprio script de backfill (sem job Glue separado) — ver seção \"Backfill\" acima para erros/sucesso." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- não disparado (\`data_quality\` não escreve dado novo)" >> "$GITHUB_STEP_SUMMARY"
          fi
