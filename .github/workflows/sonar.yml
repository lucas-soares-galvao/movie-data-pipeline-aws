name: Sonar Analysis (Reusable)

# =============================================================================
# Análise de qualidade de código via SonarQube Cloud.
#
# Chamado por 00_pipeline.yml (job "sonar"), em paralelo ao terraform — nenhum
# dos dois depende do outro (Terraform provisiona infra, Sonar analisa
# código-fonte). Só é chamado em push:main porque o plano Free do SonarQube
# Cloud só analisa de forma contínua a branch marcada como "principal" no
# projeto Sonar (ver sonar-project.properties na raiz do repo) — outras
# branches são rejeitadas/ignoradas (aparecem como "Not analyzed" no
# dashboard, atrás de um selo "Upgrade").
#
# Informativo: não bloqueia o merge (sem sonar.qualitygate.wait=true). Reavaliar
# tornar bloqueante depois de calibrar o volume de achados do perfil padrão
# "Sonar way" (o plano Free não permite quality profile customizado).
# =============================================================================

on:
  workflow_call:
    secrets:
      sonar-token:
        required: true

jobs:
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            app/**/requirements.txt
            test/**/requirements_tests.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          for file in $(find test -type f -name "requirements_tests.txt"); do
            echo "Instalando dependências de teste: $file"
            pip install -r "$file"
          done
          for file in app/*/requirements.txt; do
            if [ -f "$file" ]; then
              echo "Instalando dependências da aplicação: $file"
              pip install -r "$file"
            fi
          done

      - name: Configure PYTHONPATH
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}" >> $GITHUB_ENV

      - name: Generate coverage report
        run: pytest --cov=app --cov-report=xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.sonar-token }}
