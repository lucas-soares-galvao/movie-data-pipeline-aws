name: Sonar Analysis (Reusable)

# =============================================================================
# Análise de qualidade de código via SonarQube Cloud.
#
# Chamado por _pipeline.yml (job "sonar"), depois de "test" passar e em
# paralelo ao terraform — nenhum dos dois depende do outro (Terraform
# provisiona infra, Sonar analisa código-fonte). Não roda pytest: baixa o
# coverage.xml que o test.yml publica como artifact "coverage-xml" (só em
# main), então a cobertura no Sonar é exatamente a do gate de 100%.
#
# Só é chamado em push:main porque o plano Free do SonarQube
# Cloud só analisa de forma contínua a branch marcada como "principal" no
# projeto Sonar (ver sonar-project.properties na raiz do repo) — outras
# branches são rejeitadas/ignoradas (aparecem como "Not analyzed" no
# dashboard, atrás de um selo "Upgrade").
#
# Informativo: não bloqueia o merge (sem sonar.qualitygate.wait=true). Reavaliar
# tornar bloqueante depois de calibrar o volume de achados do perfil padrão
# "Sonar way" (o plano Free não permite quality profile customizado).
# =============================================================================

on:
  workflow_call:
    secrets:
      sonar-token:
        required: true

jobs:
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Vai para a raiz do workspace, onde sonar.python.coverage.reportPaths
      # (sonar-project.properties) espera encontrar o coverage.xml.
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml
          path: .

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.sonar-token }}
